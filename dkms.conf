PACKAGE_NAME="acer-wmi-linuwu"
PACKAGE_VERSION="7.3.0.1"

BUILT_MODULE_NAME[0]="acer-wmi"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

MAKE[0]="make -C '${kernel_source_dir}' M='${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src' VERSION='${PACKAGE_VERSION}' modules"
CLEAN="make -C '${kernel_source_dir}' M='${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src' clean"

BUILD_EXCLUSIVE_KERNEL_MIN="6.14"
BUILD_EXCLUSIVE_CONFIG="CONFIG_ACPI_WMI CONFIG_INPUT_SPARSEKMAP CONFIG_ACPI_PLATFORM_PROFILE CONFIG_HWMON"

AUTOINSTALL="yes"
